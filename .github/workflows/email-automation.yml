name: GDS Facilities & Security Email Automation

on:
  schedule:
    # Run every Sunday at 12:00 PM UTC (8:00 AM Eastern)
    # Adjust the hour if you want a different time
    - cron: '0 12 * * 0'
  
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run email script
      env:
        IIQ_API_TOKEN: ${{ secrets.IIQ_API_TOKEN }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: |
        python generate_calendar_email_api.py
    
    - name: Upload artifacts (optional)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: email-output
        path: |
          facilities_security_email.html
          email_events.json
