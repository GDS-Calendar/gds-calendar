name: Update Calendar

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:       # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright ics beautifulsoup4 pytz
          playwright install chromium

      - name: Run calendar scraper
        run: python generate_calendar.py

      - name: Commit and push if calendar changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add school_events.ics
          git commit -m "♻️ Auto-update calendar" || echo "No changes to commit"
          git push
