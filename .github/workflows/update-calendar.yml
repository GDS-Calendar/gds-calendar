name: Update Calendar from iiQ API

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install requests
        pip install ics
        pip install pytz
    
    - name: Generate calendar files
      env:
        IIQ_API_TOKEN: ${{ secrets.IIQ_API_TOKEN }}
      run: |
        python generate_calendar_api.py
    
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add school_events.ics events.json
        git diff --staged --quiet || git commit -m "Update calendar from iiQ API"
        git push